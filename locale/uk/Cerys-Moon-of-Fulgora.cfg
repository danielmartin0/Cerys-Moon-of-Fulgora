[technology-description]
moon-discovery-cerys=Безповітряний супутник Фулґори, покритий товстим шаром метанового льоду. Древні уламки, включаючи колосальний ядерний реактор, застрягли в льоду, але, схоже, можуть бути відновлені. Піддається м'якому сонячному вітру під впливом магнітного поля Фулґори.\n\nВідвідувати спочатку Фулґору не обов'язково. Викид вантажу на Церіс потребує спеціальної технології (за винятком будівельних роботів). Нагріті об'єкти на Церісі з часом втрачають тепло через кору.
cerys-nuclear-scrap-recycling=Залишки ядерної промисловості фульгоріанців на Церісі можуть бути перероблені вручну або за допомогою машин.
cerys-nitrogen-rich-mineral-processing=Вилуговування багатих на азот мінералів сірчаною кислотою вивільняє азотні сполуки та дає залізну руду.
cerys-fulgoran-cryogenics=Розблоковує низку можливостей у [entity=cerys-fulgoran-cryogenic-plant].
cerys-electromagnetic-tooling=Пристрої для зберігання енергії та експериментів з електромагнітними полями.
cerysian-science-pack=Глибше розуміння фульгоріанських технологій, що відносяться до Церіса.
cerys-gas-venting=Прості методи видалення газів, а на поверхнях, що знаходяться під тиском, - рідин.
cerys-lubricant-synthesis=Дозволяє синтезувати мастильні матеріали з вуглеводнів з використанням літієвого каталізатора.
cerys-advanced-structure-repair=Дозволяє виконувати просунутий ремонт і покращення фульгоріанських машин, включно з виготовленням будівельних лісів для підготовки Фульгоріанського ядерного реактора до ремонту.
cerys-mixed-oxide-waste-reprocessing=Відпрацьовані МОКС-паливні елементи можуть бути перероблені в Плутоній-239, а також в інший високорадіоактивний ізотоп.
cerys-cargo-drops=Дозволяє вантажним капсулам приземлятися на Церісі без руйнування магнітною атмосферою.
cerys-plutonium-weaponry=Руйнівна зброя, здатна знищити величезні території.
cerys-applications-of-radioactivity=Технологія, що використовує радіоактивні ізотопи плутонію.
cerys-radiative-heaters=Дозволяє будувати випромінювальні обігрівальні башти, а також добувати башти на Церісі.
cerys-reactor-fuel=Паливні елементи для реакторів ділення, виготовлені з кількох хімічних елементів.
cerys-radioactive-module=Варіант модуля продуктивності 4-го рівня, який розпадається до еквівалента 2.5 рівня. Може бути вставлений у машини за допомогою [item=cerys-radiation-proof-inserter].
cerys-overclock-module=Варіант модуля швидкості 4-го рівня з подвійним ефектом [item=speed-module-3]. Однак він пригнічує бонуси до продуктивності.
cerys-holmium-recrystalization=Просунута обробка гольмієвої руди.
cerys-mixed-oxide-reactors=Покращений реактор ділення (для використання поза планетою).
cerys-legacy-reactor-fuel-productivity=У Cerys v4.0 модулі продуктивності було видалено з рецепту паливного елемента. Щоб не зламати наявні космічні платформи, у старих збереженнях відкривається ця секретна технологія. Її можна вимкнути в налаштуваннях мода.

