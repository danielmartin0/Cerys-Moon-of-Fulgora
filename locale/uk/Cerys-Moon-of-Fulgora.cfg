[item-description]
mixed-oxide-fuel-cell=Виготовляється з розщеплюваних ізотопів урану та плутонію.
plutonium-238=Радіоактивний ізотоп плутонію. Цінне джерело портативної енергії.
plutonium-239=Подільний ізотоп плутонію. Здається, його створено нестандартним способом.
cerys-fulgoran-reactor-scaffold=Якщо встановити його точно над Фульгоріанським реактором без будь-яких блокуючих астероїдів, почнеться ремонт. Ви також можете підвищити якість відремонтованого реактора, побудувавши зверху за допомогою супер-примусової побудови якісний каркас (не примарний).
cerys-hydrogen-bomb=Після запуску тримайтеся подалі.
cerys-discover-fulgoran-cryogenics=Являє собою особливий рецепт, що розблоковує [technology=cerys-fulgoran-cryogenics].
cerys-radioactive-module-charged=Варіант модуля продуктивності 4-го рівня, який з часом розпадається до еквівалента 2.5 рівня, але може бути перезаряджений за допомогою [item=plutonium-239] у центрифузі.\nМоже бути вставлений у машини за допомогою [item=cerys-radiation-proof-inserter].
cerys-radioactive-module-decayed=Розпадена форма [item=cerys-radioactive-module-charged], удвічі слабша, доки її не перезарядять у центрифузі.\nМоже бути видалена з машин за допомогою [item=cerys-radiation-proof-inserter].
cerys-overclock-module=Модуль 4-го рівня з ефектом двох [item=speed-module-3]. Однак він пригнічує бонуси до продуктивності.

