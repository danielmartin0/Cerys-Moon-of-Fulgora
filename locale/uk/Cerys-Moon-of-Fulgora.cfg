cerys-undo-marathon-multiplier=Скасувати множник вартості технологій для технологій Церіса
cerys-radiative-heaters-require-cryogenic-science=Технологія випромінювальних обігрівачів потребує кріогенних дослідницьких пакетів
cerys-fusion-reactor-requires-radiative-tower=Технологія термоядерного реактора потребує технології випромінювальної башти

[mod-setting-description]
cerys-asteroid-chunks-drop-on-belts=Скидання уламків на конвеєри увімкнено за замовчуванням для автоматизованого видобування астероїдів з використанням лише конвеєрів.
cerys-prevent-cargo-drops-without-technology=Виняток становлять гравці.
cerys-disable-solar-wind-when-not-looking-at-surface=За замовчуванням використання UPS сонячним вітром різко знижується, якщо жоден з гравців не дивиться на Церіс. Цей параметр повністю вимикає рух сонячного вітру в такому випадку, повністю оптимізуючи його для UPS. Це впливає на геймплей.
cerys-technology-compatibility-mode=Фульгоріанська кріогенна технологія використовує можливості версії гри 2.0, яка підтримується не всіма модами, чутливими до рецептів. Цей параметр змінює тригер технології таким чином, що замість розблокування при виконанні рецепту технологія розблоковується при створенні предмета (деталі для ремонту древньої структури).
cerys-solar-wind-spawn-rate-percentage=Для оптимізації продуктивності. Впливає на геймплей.
cerys-disable-quality-mechanics=Налаштування для сумісності. Видаляє рецепти покращення якості фульгоріанських машин.
cerys-enforce-vanilla-recycling-recipes=Гарантує, що деякі рецепти переробки збережуть свою ванільну форму, щоб Церіс з більшою ймовірністю був придатний до гри. Впливає на: трубу, теплову трубу, маяк, парову турбіну, центрифугу, залізну шестерню, мідний кабель, електросхему, просунуту схему, процесор, бетон, тверде паливо, сталеву балку, мідну плиту, залізну плиту, кам'яну цеглу, пластиковий брусок, гольмієву плиту. Примітка: деякі перевизначення працюють інакше, якщо встановлено Krastorio 2.
cerys-dynamic-lighting=Увімкнення цього параметра може спричиняти графічні артефакти за низьких налаштувань графіки або у світах, згенерованих до Церіс v2. Впливає на сонячну енергію.
cerys-infinite-braking-technology=Необхідно для використання всіх переваг плутонієвого палива. За замовчуванням вимкнено, оскільки Церіс - самостійний мод.
cerys-sandbox-mode=Знімає обмеження на викид вантажів на Церіс. Це дозволяє обійти передбачуваний геймплей місяця, але дає можливість скоротити перехід до вільної гри.
cerys-use-fulgora-starmap-graphic=Моди, що змінюють зовнішній вигляд Фулґори, змінять фон за Церісом. УВАГА: у ванільному Церісі фон Фулґори стане більш розмитим.
cerys-undo-marathon-multiplier=Можна використати, щоб компенсувати параметр карти «марафон» (вартість технологій). Наприклад, якщо значення дорівнює 3, ціна (не нескінченних) технологій Церіса буде зменшена в 3 рази. Можливі похибки заокруглення.
cerys-fusion-reactor-requires-radiative-tower=Робить технологію випромінювальної башти обов'язковою умовою для термоядерних реакторів на Аквіло, перетворюючи Церіс на обов'язкову частину ігрового прогресу.