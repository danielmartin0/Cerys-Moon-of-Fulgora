[space-location-description]
cerys=Безповітряний супутник Фулґори, покритий товстим шаром метанового льоду. Стародавні уламки, що застрягли в льоду, здається, можна відремонтувати. Нагріті об'єкти на Церісі з часом втрачають тепло через кору. Викид вантажу потребує спеціальної технології (за винятком будівельних роботів).

[tips-and-tricks-item-name]
cerys-briefing=Інструктаж по Церісу
cerys-plutonium-generation=Генерація плутонію

[tips-and-tricks-item-description]
cerys-briefing=[planet=cerys] - безповітряний супутник, що обертається навколо [planet=fulgora].\nСонячні частинки, що відхиляються магнітним полем [planet=fulgora], проносяться над головою і заважають безпілотним космічним кораблям, поки не буде проведено дослідження [technology=planetslib-cerys-cargo-drops].\nПоверхня вкрита кількома шарами [item=methane-ice] і завалена уламками стародавніх машин. Багато з них можна оживити, в тому числі [entity=cerys-fulgoran-radiative-tower], яка випромінює тепло в квадратній зоні.\nКрім метанового льоду, ви можете знайти [entity=cerys-nuclear-scrap], [entity=cerys-ruin-medium], [entity=cerys-nitrogen-rich-minerals] та [entity=lithium-brine].\nПідтримувати на цьому супутнику стабільну довгострокову базу може бути непросто через логістику обігріву.
cerys-plutonium-generation=[item=plutonium-239] може утворитися щоразу, коли [entity=cerys-solar-wind-particle] стикається з [item=uranium-238] на Церісі. Можна відзначити такі факти про цей процес:\n\n• [item=uranium-238] на конвеєрах має у 30 разів вищу ймовірність мутації, ніж [item=uranium-238] у скринях.\n\n• Швидкість утворення [item=plutonium-239] завжди пропорційна кількості [item=uranium-238]. Розподіл урану між більшою кількістю скринь чи конвеєрів не впливає на швидкість.\n\n• [entity=cerys-solar-wind-particle], що майже зупинилася, випаровується.\n\n• Швидкість [entity=cerys-solar-wind-particle] не впливає на ймовірність мутації плутонію.\n\n• Мутація [item=uranium-238] в інвентарях, як-от у скринях, може відбутися навіть за відсутності порожніх комірок, оскільки сонячний вітер за потреби видалить пачку урану.\n\n• [entity=cerys-solar-wind-particle] не активує шанс мутації при повторних зіткненнях з тим самим інвентарем або клітиною конвеєра; щоб вихідний інвентар або конвеєр знову розглядався для мутації, потрібні зіткнення з іншими інвентарями або конвеєрами.\n\n• Примарні заряджені частинки поводяться з іншими об'єктами так, ніби ті повністю заряджені.\n\n• З міркувань продуктивності [entity=cerys-solar-wind-particle] моделюється повільніше, якщо жоден гравець не дивиться на Церіс, але ймовірність мутації збільшується настільки, що швидкість утворення [item=plutonium-239] залишається незмінною.

