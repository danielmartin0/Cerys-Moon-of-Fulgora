[entity-description]
cerys-fulgoran-radiative-tower=Нагріває прилеглі клітини та предмети інфрачервоним випромінюванням. Споживає тверде паливо.
cerys-fulgoran-radiative-tower-contracted-container=Нагріває прилеглі клітини та предмети інфрачервоним випромінюванням. Споживає тверде паливо.
cerys-fulgoran-radiative-tower-contracted-reactor=Нагріває прилеглі клітини та предмети інфрачервоним випромінюванням. Споживає тверде паливо.
cerys-fulgoran-reactor-wreck-cleared=Руїни чекають, коли на них встановлять будівельні ліси.
cerys-fulgoran-reactor=Переважно працездатний древній реактор ділення. Можливо, його небезпечне випромінювання можна якось екранувати.
cerys-fulgoran-reactor-wreck=Древній реактор ділення, знайдений у стані небезпечної несправності.
cerys-fulgoran-reactor-wreck-scaffolded=Древній реактор ділення, знайдений у стані небезпечної несправності. Будівельні ліси встановлені.
cerys-fulgoran-reactor-scaffolded=Древній реактор ділення, знайдений у стані небезпечної несправності. Будівельні ліси встановлені.
cerys-solar-wind-particle=Заряджені частинки сонячного вітру направляються магнітним полем Фулґори і бомбардують Церіс.
cerys-charging-rod=Дивно влаштований зразок фульгоріанської технології. Зберігає та вивільняє енергію, як акумулятор.
cerys-gamma-radiation=Небезпечно для здоров'я. Блокується резервуарами з рідиною.
cerys-mixed-oxide-reactor=Використовує МОКС-паливні елементи для генерації тепла. Генерує більше тепла при будівництві поруч з іншими реакторами.
cerys-neutron-dummy=Небезпечний для здоров'я. Має тенденцію розлітатися в різні боки.
cerys-fulgoran-teleporter=Древній телепортатор, який, схоже, знаходиться в робочому стані.
cerys-fulgoran-cryogenic-plant=Древня кріогенна установка, ключ до фульгоріанської технології на Церісі.
cerys-radiation-proof-inserter=Вставляє та видаляє [item=cerys-radioactive-module-decayed] та [item=cerys-radioactive-module-charged] з машин.\nФільтр, напрямок та розмір стеку маніпулятора автоматично встановлюються залежно від стану машини.\nПередача сигналу схеми [virtual-signal=signal-deny] вимкне маніпулятор.
cerys-solar-ghost-maker=Створює [entity=cerys-solar-wind-particle-ghost]. Корисно для тестування.
cerys-solar-wind-particle-ghost=Корисно для тестування.

