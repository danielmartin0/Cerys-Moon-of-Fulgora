mining-radiative-towers=Дозволяє добувати Фульгоріанські випромінювальні башти на Церісі.
cargo-drops-tech-name=Пробити дірку в магнітосфері
cargo-drops-tech-description=Запуск потужної ядерної бомби на орбіту Церіса з ракетної шахти дозволяє вантажним капсулам приземлятися без порушення магнітної атмосфери.
planetary-asteroid-description=Імунітет до лазерів завдяки магнітній атмосфері.
neutron-bomb-description=Мініатюрна ядерна бомба, що випускає нейтрони, які розсіюються у хмару, якщо тиск не нижче __1__.

[mod-setting-name]
cerys-prevent-cargo-drops-without-technology=Заборонити викид вантажних капсул на Церіс, поки не досліджена технологія
cerys-disable-solar-wind-when-not-looking-at-surface=Заморозити сонячний вітер, коли не дивитеся на Церіс
cerys-solar-wind-performance-mode=Режим продуктивності сонячного вітру
cerys-plutonium-generation-rate-multiplier=Множник швидкості напрацювання плутонію
cerys-technology-compatibility-mode=Режим сумісності технологій
cerys-asteroid-chunks-drop-on-belts=Планетарні астероїди скидають уламки на конвеєри
cerys-solar-wind-spawn-rate-percentage=Щільність сонячного вітру
cerys-disable-quality-mechanics=Вимкнути покращення якості машин
cerys-enforce-vanilla-recycling-recipes=Не допускати змін деяких рецептів переробки
cerys-disable-kofi-toast=Вимкнути тост при першому запуску ракети
cerys-dynamic-lighting=Динамічне освітлення на Церісі
cerys-infinite-braking-technology=Додати нескінченну технологію гальмування
